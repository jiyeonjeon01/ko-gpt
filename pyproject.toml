[project]
name = "ko-gpt"
version = "0.1.0"
description = "무작위 초기화부터 직접 학습하는 한국어 중심 대화형 GPT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
]

[dependency-groups]
data = [
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.0",
    "tokenizers==0.23.3",
]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
